# Railway staging — web service (default linked service)
# Image/video workers: create two additional Railway services from this repo with:
#   npm run worker:image
#   npm run worker:video
# Add PostgreSQL + Redis plugins to the project; reference their URLs in env vars.

[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` (respects .npmrc legacy-peer-deps). Only build here.
buildCommand = "npm run build"

[deploy]
# Healthcheck is configured on the web service in Railway dashboard only.
# Workers are non-HTTP; a shared healthcheckPath causes deploy failure (SIGTERM).
startCommand = "sh scripts/railway-start.sh"
preDeployCommand = ["sh scripts/railway-predeploy.sh"]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
